<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Storage Demo - HunterSite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .upload-area {
      border: 2px dashed #dee2e6;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      transition: border-color 0.3s;
    }
    .upload-area:hover {
      border-color: #0d6efd;
    }
    .upload-area.dragover {
      border-color: #0d6efd;
      background-color: #f8f9fa;
    }
    .file-preview {
      max-width: 200px;
      max-height: 200px;
      margin: 10px auto;
      display: block;
    }
    .progress {
      height: 5px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">🔥 Firebase Storage Demo</h1>
    
    <!-- Firebase Status -->
    <div class="alert alert-info" id="firebase-status">
      <strong>Firebase Status:</strong> <span id="status-text">Checking...</span>
    </div>

    <!-- Profile Picture Upload -->
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">📸 Profile Picture Upload</h5>
      </div>
      <div class="card-body">
        <form id="profile-form">
          <div class="mb-3">
            <label for="profile-input" class="form-label">Choose Profile Picture</label>
            <input type="file" class="form-control" id="profile-input" 
                   accept="image/jpeg,image/png,image/webp">
            <div class="form-text">Max size: 5MB. Formats: JPG, PNG, WebP</div>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Preview:</label>
            <div id="profile-preview" class="upload-area">
              <img id="profile-img" class="file-preview d-none" alt="Profile preview">
              <p id="profile-placeholder" class="mb-0 text-muted">
                No image selected. Drag and drop or click to choose.
              </p>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary">Upload Profile Picture</button>
        </form>
        
        <div id="profile-progress" class="mt-3 d-none">
          <div class="progress">
            <div class="progress-bar" role="progressbar"></div>
          </div>
        </div>
        
        <div id="profile-result" class="mt-3"></div>
      </div>
    </div>

    <!-- Resume Upload -->
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">📄 Resume Upload</h5>
      </div>
      <div class="card-body">
        <form id="resume-form">
          <div class="mb-3">
            <label for="resume-input" class="form-label">Choose Resume</label>
            <input type="file" class="form-control" id="resume-input" 
                   accept=".pdf,.doc,.docx">
            <div class="form-text">Max size: 10MB. Formats: PDF, DOC, DOCX</div>
          </div>
          
          <div class="mb-3">
            <div class="upload-area" id="resume-drop-area">
              <p class="mb-0">
                <i class="bi bi-file-earmark-arrow-up"></i>
                Drag and drop your resume here or click to choose
              </p>
            </div>
          </div>
          
          <button type="submit" class="btn btn-success">Upload Resume</button>
        </form>
        
        <div id="resume-progress" class="mt-3 d-none">
          <div class="progress">
            <div class="progress-bar bg-success" role="progressbar"></div>
          </div>
        </div>
        
        <div id="resume-result" class="mt-3"></div>
      </div>
    </div>

    <!-- File Manager -->
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">📁 Your Files</h5>
      </div>
      <div class="card-body">
        <button class="btn btn-outline-primary mb-3" id="list-files-btn">
          List My Files
        </button>
        
        <div id="files-list"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase functions (these will work once Firebase is configured)
    import { uploadProfilePicture, uploadResume, listFiles, deleteFile, formatFileSize, isStorageAvailable } from './assets/js/firebase/storage.js';
    
    // DOM Elements
    const statusText = document.getElementById('status-text');
    const profileForm = document.getElementById('profile-form');
    const profileInput = document.getElementById('profile-input');
    const profileImg = document.getElementById('profile-img');
    const profilePlaceholder = document.getElementById('profile-placeholder');
    const profileResult = document.getElementById('profile-result');
    const resumeForm = document.getElementById('resume-form');
    const resumeInput = document.getElementById('resume-input');
    const resumeResult = document.getElementById('resume-result');
    const listFilesBtn = document.getElementById('list-files-btn');
    const filesList = document.getElementById('files-list');
    
    // Mock user ID (in real app, get from auth system)
    const userId = 'demo-user-' + Date.now();
    
    // Check Firebase availability
    function checkFirebaseStatus() {
      if (isStorageAvailable()) {
        statusText.textContent = '✅ Connected and ready';
        statusText.className = 'text-success';
      } else {
        statusText.textContent = '⚠️ Not configured - check .env file';
        statusText.className = 'text-warning';
      }
    }
    
    // Profile picture preview
    profileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          profileImg.src = e.target.result;
          profileImg.classList.remove('d-none');
          profilePlaceholder.classList.add('d-none');
        };
        reader.readAsDataURL(file);
      }
    });
    
    // Profile picture upload
    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = profileInput.files[0];
      
      if (!file) {
        alert('Please select a profile picture');
        return;
      }
      
      try {
        const result = await uploadProfilePicture(file, userId);
        
        profileResult.innerHTML = `
          <div class="alert alert-success">
            <strong>✅ Upload Successful!</strong><br>
            File: ${result.name}<br>
            Size: ${formatFileSize(result.size)}<br>
            <a href="${result.downloadURL}" target="_blank" class="btn btn-sm btn-outline-primary mt-2">
              View Image
            </a>
          </div>
        `;
        
        profileForm.reset();
        profileImg.classList.add('d-none');
        profilePlaceholder.classList.remove('d-none');
        
      } catch (error) {
        profileResult.innerHTML = `
          <div class="alert alert-danger">
            <strong>❌ Upload Failed:</strong> ${error.message}
          </div>
        `;
      }
    });
    
    // Resume upload with drag and drop
    const resumeDropArea = document.getElementById('resume-drop-area');
    
    resumeDropArea.addEventListener('click', () => resumeInput.click());
    
    resumeDropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      resumeDropArea.classList.add('dragover');
    });
    
    resumeDropArea.addEventListener('dragleave', () => {
      resumeDropArea.classList.remove('dragover');
    });
    
    resumeDropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      resumeDropArea.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        resumeInput.files = files;
        resumeDropArea.innerHTML = `
          <p class="mb-0 text-success">
            <i class="bi bi-check-circle"></i>
            ${files[0].name} (${formatFileSize(files[0].size)})
          </p>
        `;
      }
    });
    
    // Resume form submission
    resumeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = resumeInput.files[0];
      
      if (!file) {
        alert('Please select a resume file');
        return;
      }
      
      try {
        const result = await uploadResume(file, userId);
        
        resumeResult.innerHTML = `
          <div class="alert alert-success">
            <strong>✅ Resume Uploaded!</strong><br>
            File: ${result.name}<br>
            Size: ${formatFileSize(result.size)}<br>
            <a href="${result.downloadURL}" target="_blank" class="btn btn-sm btn-outline-success mt-2">
              Download Resume
            </a>
          </div>
        `;
        
        resumeForm.reset();
        resumeDropArea.innerHTML = `
          <p class="mb-0">
            <i class="bi bi-file-earmark-arrow-up"></i>
            Drag and drop your resume here or click to choose
          </p>
        `;
        
      } catch (error) {
        resumeResult.innerHTML = `
          <div class="alert alert-danger">
            <strong>❌ Upload Failed:</strong> ${error.message}
          </div>
        `;
      }
    });
    
    // List user files
    listFilesBtn.addEventListener('click', async () => {
      try {
        const files = await listFiles(`users/${userId}/`);
        
        if (files.length === 0) {
          filesList.innerHTML = '<p class="text-muted">No files found.</p>';
          return;
        }
        
        let html = '<div class="row">';
        files.forEach(file => {
          html += `
            <div class="col-md-6 mb-3">
              <div class="card">
                <div class="card-body">
                  <h6 class="card-title">${file.name}</h6>
                  <p class="card-text">
                    <small class="text-muted">
                      Size: ${formatFileSize(file.size)}<br>
                      Type: ${file.type}<br>
                      Uploaded: ${new Date(file.uploadedAt).toLocaleDateString()}
                    </small>
                  </p>
                  <div class="btn-group" role="group">
                    <a href="${file.downloadURL}" target="_blank" class="btn btn-sm btn-outline-primary">
                      Download
                    </a>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteFile('${file.path}')">
                      Delete
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        html += '</div>';
        
        filesList.innerHTML = html;
        
      } catch (error) {
        filesList.innerHTML = `
          <div class="alert alert-warning">
            <strong>⚠️ Could not list files:</strong> ${error.message}
          </div>
        `;
      }
    });
    
    // Delete file function
    window.deleteFile = async (path) => {
      if (!confirm('Are you sure you want to delete this file?')) {
        return;
      }
      
      try {
        await deleteFile(path);
        alert('File deleted successfully');
        listFilesBtn.click(); // Refresh the list
      } catch (error) {
        alert(`Failed to delete file: ${error.message}`);
      }
    };
    
    // Initialize
    checkFirebaseStatus();
  </script>
</body>
</html>
