<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
  <title>Huntersite – Login</title>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="login-bg">
  <header class="brand-hero" role="banner">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="markG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#222" />
            <stop offset="1" stop-color="#111" />
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="14" fill="url(#markG)" />
        <rect x="10" y="38" width="30" height="12" rx="6" fill="#111" />
        <circle cx="48" cy="38" r="9" fill="#111" />
        <rect x="52" y="43" width="10" height="5" rx="2.5" fill="#111" />
      </svg>
    </div>
    <h1 class="brand-name">HUNTERSITE</h1>
  </header>

  <main class="auth" role="main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card__inner">
        <header class="auth-header">
          <h2 id="auth-title">Ready to take the next step?</h2>
          <p class="auth-sub">Create an account or sign in.</p>
        </header>

        <div class="auth-actions">
          <div id="g_id_onload"
               data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="popup"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>

          <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="outline"
               data-text="signin_with"
               data-size="large"
               data-logo_alignment="left"
               style="width: 100%;">
          </div>
        </div>

        <div class="divider" role="separator" aria-label="or">or</div>

        <div class="alert alert-info mb-3" role="alert">
          <small><strong>Note:</strong> Use your Gmail account to sign in.</small>
        </div>

        <form class="auth-form" novalidate>
          <div class="field mb-3">
            <label class="label">Gmail address <span class="req">*</span></label>
            <input class="input" type="email" name="email" id="loginEmail" autocomplete="email" required placeholder="yourname@gmail.com" />
          </div>

          <div class="field mb-3">
            <label class="label">Password <span class="req">*</span></label>
            <input class="input" type="password" name="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••" />
          </div>

          <button class="btn-primary-lg" type="submit" id="submitBtn">
            <span>Continue</span>
            <span class="arrow" aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-terms mt-4">
          By signing in, you agree to our 
          <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/auth.js"></script>
</body>

</html>
