<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
  <title>Huntersite – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Darken register link/button style */
    .register-link {
      display: inline-block;
      padding: 0.65rem 1rem;
      background-color: #343a40;
      color: #ffffff;
      border: 1px solid #343a40;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link:hover {
      background-color: #23272b;
      border-color: #23272b;
      color: #ffffff;
      text-decoration: none;
    }
  </style>
</head>

<body class="login-bg">
  <header class="brand-hero" role="banner">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="markG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#222" />
            <stop offset="1" stop-color="#111" />
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="14" fill="url(#markG)" />
        <rect x="10" y="38" width="30" height="12" rx="6" fill="#111" />
        <circle cx="48" cy="38" r="9" fill="#111" />
        <rect x="52" y="43" width="10" height="5" rx="2.5" fill="#111" />
      </svg>
    </div>
    <h1 class="brand-name">HUNTERSITE</h1>
  </header>

  <main class="auth" role="main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card__inner">
        <header class="auth-header">
          <h2 id="auth-title">Ready to take the next step?</h2>
          <p class="auth-sub">Create an account or sign in.</p>
        </header>

        <div class="auth-actions">
          <div id="g_id_onload"
               data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="popup"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>

          <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="outline"
               data-text="signin_with"
               data-size="large"
               data-logo_alignment="left"
               style="width: 100%;">
          </div>
        </div>

        <div class="divider" role="separator" aria-label="or">or</div>

        <div class="alert alert-info mb-3" role="alert">
          <small><strong>Note:</strong> Use your Gmail account to sign in.</small>
        </div>

        <form class="auth-form" novalidate>
          <div class="field mb-3">
            <label class="label">Gmail address <span class="req">*</span></label>
            <input class="input" type="email" name="email" id="loginEmail" autocomplete="email" required placeholder="yourname@gmail.com" />
          </div>

          <div class="field mb-3">
            <label class="label">Password <span class="req">*</span></label>
            <input class="input" type="password" name="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••" />
          </div>

          <div class="field mb-3 d-flex justify-content-between align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label text-muted" for="rememberMe">
                Remember me
              </label>
            </div>
            <a href="#" class="text-muted small" id="forgotPassword">Forgot password?</a>
          </div>

          <button class="btn-primary-lg" type="submit" id="submitBtn">
            <span>Sign In</span>
            <span class="arrow" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-links mt-3">
          <p class="text-center mb-2">
            Don't have an account? 
            <a href="#" class="link register-link" id="registerBtn">Register here</a>
          </p>
        </div>

        <p class="auth-terms mt-4">
          By signing in, you agree to our 
          <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Login form functionality
      const loginForm = document.querySelector('.auth-form');
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          
          if (!email || !password) {
            showToast('Please fill in all fields.', 'warning');
            return;
          }
          
          // Validate Gmail address
          if (!email.endsWith('@gmail.com')) {
            showToast('Please use a Gmail address to sign in.', 'warning');
            return;
          }
          
          // Attempt login
          handleLogin(email, password);
        });
      }
      
      // Function to handle login
      function handleLogin(email, password) {
        try {
          let user = null;
          
          // Try StorageManager first
          if (window.StorageManager && window.StorageManager.authenticateUser) {
            user = window.StorageManager.authenticateUser(email, password);
          } else {
            // Fallback: check localStorage
            const users = JSON.parse(localStorage.getItem('hunterSite_users') || '[]');
            user = users.find(u => u.email === email && u.password === password);
          }
          
          if (user) {
            // Login successful
            if (window.StorageManager && window.StorageManager.setCurrentUser) {
              window.StorageManager.setCurrentUser(user);
            } else {
              // Fallback: store in sessionStorage
              sessionStorage.setItem('currentUser', JSON.stringify(user));
            }
            
            // Handle "Remember Me"
            const rememberMe = document.getElementById('rememberMe').checked;
            if (rememberMe) {
              localStorage.setItem('rememberedEmail', email);
            } else {
              localStorage.removeItem('rememberedEmail');
            }
            
            showToast('Login successful! Redirecting...', 'success');
            
            // Redirect to dashboard after short delay
            setTimeout(() => {
              window.location.href = '../index.html';
            }, 1000);
            
          } else {
            showToast('Invalid email or password. Please try again.', 'danger');
          }
          
        } catch (error) {
          console.error('Login error:', error);
          showToast('Login failed. Please try again.', 'danger');
        }
      }
      
      // Forgot password functionality
      document.getElementById('forgotPassword').addEventListener('click', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) {
          showToast('Please enter your email address first.', 'warning');
          document.getElementById('loginEmail').focus();
          return;
        }
        
        if (!email.endsWith('@gmail.com')) {
          showToast('Please enter a valid Gmail address.', 'warning');
          return;
        }
        
        // Show reset password modal
        showForgotPasswordModal(email);
      });
      
      // Function to show forgot password modal
      function showForgotPasswordModal(email) {
        const modalHTML = `
          <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="forgotPasswordLabel">Reset Password</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p>We'll send a password reset link to:</p>
                  <p class="fw-bold">${email}</p>
                  <div class="alert alert-info">
                    <small>Note: This is a demo. In a real application, you would receive an email with reset instructions.</small>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="button" class="btn btn-primary" id="sendResetBtn">Send Reset Link</button>
                </div>
              </div>
            </div>
          </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHTML);
        const modal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
        modal.show();
        
        // Handle send reset button
        document.getElementById('sendResetBtn').addEventListener('click', function() {
          showToast('Password reset link sent! Check your email.', 'success');
          modal.hide();
          
          // Clean up
          document.getElementById('forgotPasswordModal').addEventListener('hidden.bs.modal', function() {
            this.remove();
          });
        });
        
        // Clean up modal
        document.getElementById('forgotPasswordModal').addEventListener('hidden.bs.modal', function() {
          this.remove();
        });
      }
      
      // Remember me functionality
      const rememberMeCheckbox = document.getElementById('rememberMe');
      if (rememberMeCheckbox) {
        // Check if user was remembered
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
          document.getElementById('loginEmail').value = rememberedEmail;
          rememberMeCheckbox.checked = true;
        }
      }
      
      // Register button functionality
      document.getElementById('registerBtn').addEventListener('click', function(e) {
        e.preventDefault();
        
        // Show registration modal or redirect to registration page
        showRegistrationModal();
      });
      
      // Function to show registration modal
      function showRegistrationModal() {
        // Create modal HTML
        const modalHTML = `
          <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="registerModalLabel">Create Account</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <form id="registerForm" novalidate>
                    <div class="mb-3">
                      <label for="registerName" class="form-label">Full Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="registerName" name="name" required placeholder="Enter your full name">
                      <div class="invalid-feedback">Please provide your full name.</div>
                    </div>
                    <div class="mb-3">
                      <label for="registerEmail" class="form-label">Gmail Address <span class="text-danger">*</span></label>
                      <input type="email" class="form-control" id="registerEmail" name="email" required placeholder="yourname@gmail.com">
                      <div class="invalid-feedback">Please provide a valid Gmail address.</div>
                    </div>
                    <div class="mb-3">
                      <label for="registerPassword" class="form-label">Password <span class="text-danger">*</span></label>
                      <input type="password" class="form-control" id="registerPassword" name="password" required placeholder="Create a password" minlength="8">
                      <div class="invalid-feedback">Password must be at least 8 characters long.</div>
                    </div>
                    <div class="mb-3">
                      <label for="registerConfirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                      <input type="password" class="form-control" id="registerConfirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                      <div class="invalid-feedback">Passwords do not match.</div>
                    </div>
                    <div class="mb-3 form-check">
                      <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                      <label class="form-check-label" for="agreeTerms">
                        I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a>
                      </label>
                      <div class="invalid-feedback">You must agree to the terms and conditions.</div>
                    </div>
                  </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary" form="registerForm">Create Account</button>
                </div>
              </div>
            </div>
          </div>
        `;
        
        // Add modal to body
        document.body.insertAdjacentHTML('beforeend', modalHTML);
        
        // Initialize modal
        const modal = new bootstrap.Modal(document.getElementById('registerModal'));
        modal.show();
        
        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
          e.preventDefault();
          
          if (!this.checkValidity()) {
            e.stopPropagation();
            this.classList.add('was-validated');
            return;
          }
          
          const formData = new FormData(this);
          const userData = {
            name: formData.get('name'),
            email: formData.get('email'),
            password: formData.get('password'),
            createdAt: new Date().toISOString()
          };
          
          // Validate passwords match
          if (formData.get('password') !== formData.get('confirmPassword')) {
            document.getElementById('registerConfirmPassword').setCustomValidity('Passwords do not match');
            this.classList.add('was-validated');
            return;
          }
          
          // Validate Gmail address
          if (!userData.email.endsWith('@gmail.com')) {
            document.getElementById('registerEmail').setCustomValidity('Please use a Gmail address');
            this.classList.add('was-validated');
            return;
          }
          
          // Check if user already exists
          try {
            const existingUser = window.StorageManager ? window.StorageManager.getUserByEmail(userData.email) : null;
            if (existingUser) {
              showToast('An account with this email already exists. Please try logging in instead.', 'warning');
              modal.hide();
              return;
            }
          } catch (error) {
            console.warn('Could not check existing users:', error);
          }
          
          // Create new user account
          try {
            if (window.StorageManager && window.StorageManager.createUser) {
              // Use StorageManager to create user
              const newUser = window.StorageManager.createUser(userData);
              console.log('User created successfully:', newUser);
              
              // Show success message
              showToast('Account created successfully! You can now sign in with your credentials.', 'success');
              
              // Close modal
              modal.hide();
              
              // Optionally redirect to login or auto-fill login form
              setTimeout(() => {
                // Auto-fill login form with the registered email
                const loginEmail = document.getElementById('loginEmail');
                if (loginEmail) {
                  loginEmail.value = userData.email;
                  loginEmail.focus();
                }
              }, 1000);
              
            } else {
              // Fallback: store in localStorage directly
              const users = JSON.parse(localStorage.getItem('hunterSite_users') || '[]');
              const userExists = users.some(u => u.email === userData.email);
              
              if (userExists) {
                showToast('An account with this email already exists. Please try logging in instead.', 'warning');
                modal.hide();
                return;
              }
              
              // Add new user
              userData.id = Date.now().toString();
              userData.verified = false; // Email verification would be needed in production
              users.push(userData);
              localStorage.setItem('hunterSite_users', JSON.stringify(users));
              
              console.log('User created successfully (fallback):', userData);
              
              // Show success message
              showToast('Account created successfully! You can now sign in with your credentials.', 'success');
              
              // Close modal
              modal.hide();
              
              // Auto-fill login form
              setTimeout(() => {
                const loginEmail = document.getElementById('loginEmail');
                if (loginEmail) {
                  loginEmail.value = userData.email;
                  loginEmail.focus();
                }
              }, 1000);
            }
            
          } catch (error) {
            console.error('Registration error:', error);
            showToast('Registration failed. Please try again.', 'danger');
          }
        });
        
        // Clean up modal when hidden
        document.getElementById('registerModal').addEventListener('hidden.bs.modal', function() {
          this.remove();
        });
      }
      
      // Function to show toast notifications
      function showToast(message, type = 'info') {
        const toastHTML = `
          <div class="toast align-items-center text-white bg-${type} border-0 position-fixed top-0 end-0 m-3" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
              <div class="toast-body">${message}</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
          </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', toastHTML);
        const toast = document.querySelector('.toast:last-child');
        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();
        
        setTimeout(() => {
          toast.remove();
        }, 5000);
      }
    });
  </script>
</body>

</html>
